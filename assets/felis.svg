<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">Felis logo</title>
  <desc id="desc">A simple stylized cat head logo for the Felis programming language</desc>
  <defs>
    <linearGradient id="g1" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB86B"/>
      <stop offset="100%" stop-color="#FF7A59"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- background circle -->
  <circle cx="300" cy="300" r="280" fill="#0b1220" />

  <!-- main head shape -->
  <path d="M140,320 C140,220 210,160 300,160 C390,160 460,220 460,320 C460,420 390,480 300,480 C210,480 140,420 140,320 Z"
        fill="url(#g1)" stroke="#0b1220" stroke-width="6"/>

  <!-- left ear -->
  <path d="M170,210 L220,110 C240,90 260,100 270,120 L220,200 Z"
        fill="#FF8550" stroke="#0b1220" stroke-width="5"/>

  <!-- right ear -->
  <path d="M430,210 L380,110 C360,90 340,100 330,120 L380,200 Z"
        fill="#FF8550" stroke="#0b1220" stroke-width="5"/>

  <!-- face highlight -->
  <ellipse cx="300" cy="320" rx="150" ry="120" fill="url(#g2)" opacity="0.14"/>

  <!-- eyes -->
  <g fill="#0b1220">
    <ellipse cx="250" cy="310" rx="20" ry="28"/>
    <ellipse cx="350" cy="310" rx="20" ry="28"/>
    <circle cx="246" cy="302" r="6" fill="#ffffff" opacity="0.95"/>
    <circle cx="346" cy="302" r="6" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- nose -->
  <path d="M300,340 q10,12 0,18 q-10,-6 0,-18 Z" fill="#0b1220"/>

  <!-- mouth -->
  <path d="M300,358 q16,12 36,12" stroke="#0b1220" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M300,358 q-16,12 -36,12" stroke="#0b1220" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- whiskers -->
  <path d="M210,348 h-60" stroke="#0b1220" stroke-width="4" stroke-linecap="round"/>
  <path d="M210,364 h-70" stroke="#0b1220" stroke-width="3" stroke-linecap="round"/>
  <path d="M390,348 h60" stroke="#0b1220" stroke-width="4" stroke-linecap="round"/>
  <path d="M390,364 h70" stroke="#0b1220" stroke-width="3" stroke-linecap="round"/>

  <!-- subtle outline -->
  <path d="M140,320 C140,220 210,160 300,160 C390,160 460,220 460,320 C460,420 390,480 300,480 C210,480 140,420 140,320 Z"
        fill="none" stroke="#081018" stroke-width="2" opacity="0.6"/>

</svg>
